# Builds the Firebird iOS binaries from source and, for a version tag,
# attaches them to the GitHub release. The binaries published to pub.dev are
# taken from that release (see RELEASING.md).
name: Build Firebird for iOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FIREBIRD_TAG: v5.0.4
  FB_IOS_MIN: '15.0'

defaults:
  run:
    # An explicit `shell: bash` runs steps with `-eo pipefail`; the default
    # `bash -e` would hide a failed build behind `| tee`.
    shell: bash

jobs:
  build:
    name: build (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The binaries are verified with Xcode 27.2, which GitHub provides
          # only on the xcode-27 image (macOS 27, public preview as of
          # November 2026). This entry makes the release.
          - runner: xcode-27
            xcode: '27.2'
            release: true
          # macOS 26 host with Xcode 26.6: a reference build on the host OS
          # the binaries were verified on.
          - runner: macos-26
            xcode: '26.6'
            release: false
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Build tools
        run: |
          brew install automake autoconf-archive libtool ninja pkg-config cmake
          sw_vers; xcodebuild -version; cmake --version | head -n1

      - name: Firebird sources
        run: git clone --branch "$FIREBIRD_TAG" --depth 1 https://github.com/FirebirdSQL/firebird.git "$RUNNER_TEMP/firebird"

      - name: firebird.msg from the official macOS package
        env:
          # anonymous GitHub API calls from shared runners get HTTP 403
          GITHUB_TOKEN: ${{ github.token }}
        run: firebird-ios-build/fetch_firebird_msg.sh "${FIREBIRD_TAG#v}" "$RUNNER_TEMP/firebird.msg"

      - name: Build
        working-directory: ${{ runner.temp }}/firebird
        run: |
          FB_MSG_FILE="$RUNNER_TEMP/firebird.msg" \
            "$GITHUB_WORKSPACE/firebird-ios-build/build_firebird_ios.sh" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/failure-logs"
          cd "$RUNNER_TEMP/firebird"
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/failure-logs/" 2>/dev/null || true
          find vcpkg/buildtrees vcpkg_installed/vcpkg -name '*.log' -o -name 'issue_body.md' 2>/dev/null \
            | while read -r f; do mkdir -p "$RUNNER_TEMP/failure-logs/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/failure-logs/$f"; done
          find . -name config.log -not -path './vcpkg/*' \
            | while read -r f; do mkdir -p "$RUNNER_TEMP/failure-logs/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/failure-logs/$f"; done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-logs-${{ matrix.runner }}-xcode-${{ matrix.xcode }}
          path: ${{ runner.temp }}/failure-logs

      - name: Package
        id: package
        run: |
          NAME="fb_ios_embedded-binaries-${GITHUB_REF_NAME}"
          cd "$RUNNER_TEMP/firebird/ios-out"
          zip -qry "$RUNNER_TEMP/$NAME.zip" xcframeworks assets
          cd "$RUNNER_TEMP"
          shasum -a 256 "$NAME.zip" > "$NAME.zip.sha256"
          cat "$NAME.zip.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-xcode-${{ matrix.xcode }}
          path: |
            ${{ runner.temp }}/${{ steps.package.outputs.name }}.zip
            ${{ runner.temp }}/${{ steps.package.outputs.name }}.zip.sha256
            ${{ runner.temp }}/build.log

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/${{ steps.package.outputs.name }}.zip
            ${{ runner.temp }}/${{ steps.package.outputs.name }}.zip.sha256
